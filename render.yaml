services:
  - type: web
    name: resqai-backend
    env: python
    region: oregon
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt --break-system-packages
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
